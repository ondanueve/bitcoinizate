<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bitcoinizate</title>
  <meta name="robots" content="noindex">
  <script>
    /*
     * GitHub Pages serves this file for every path that does not exist.
     * It keeps old and short URLs working:
     *   /alias, /@alias, /u/alias, /u.html?u=alias -> /choppy-bitcoin/u/?u=alias  (player profiles)
     *   /dashboard/profile/                        -> /choppy-bitcoin/profile/
     *   /privacy                                   -> /privacy.html
     *   /choppy-bitcoin/chart                      -> /choppy-bitcoin/chart.html
     *   /borgesdebioyizador/p/<id>                 -> /borgesdebioyizador/p/?id=<id>  (permalinks cortos)
     * Anything else shows "page not found".
     */
    (function () {
      var path = (location.pathname || "/").replace(/\/+/g, "/");
      var parts = path.split("/").filter(Boolean);
      var first = (parts[0] || "").toLowerCase();
      var search = location.search || "";
      var hash = location.hash || "";
      var ALIAS = /^@?[A-Za-z0-9_]{3,16}$/;
      var RESERVED = { "index.html":1, "privacy":1, "privacy.html":1, "choppy-bitcoin":1, "borgesdebioyizador":1, "madcap-hash":1, "flappy-btc":1,
        "u":1, "u.html":1, "dashboard":1, "robots.txt":1, "sitemap.xml":1, "favicon.ico":1, "404.html":1 };
      function dec(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
      function profile(alias) {
        return "/choppy-bitcoin/u/?u=" + encodeURIComponent(String(alias).replace(/^@/, ""));
      }
      var to = null;
      if (parts.length === 1 && first === "privacy") to = "/privacy.html";
      else if (first === "dashboard") to = "/choppy-bitcoin/profile/" + search;
      else if (first === "choppy-bitcoin" && parts.length === 2 && parts[1].toLowerCase() === "chart") to = "/choppy-bitcoin/chart.html" + search;
      else if (first === "borgesdebioyizador" && parts.length === 3 && parts[1] === "p" && /^[2-9a-zA-Z]{6,24}$/.test(parts[2])) to = "/borgesdebioyizador/p/?id=" + parts[2];
      else if (first === "borgesdebioyizador" && parts.length === 1) to = "/borgesdebioyizador/";
      else if (first === "u.html" || (first === "u" && parts.length === 1)) to = "/choppy-bitcoin/u/" + search;
      else if (first === "u" && parts.length === 2 && ALIAS.test(dec(parts[1]))) to = profile(dec(parts[1]));
      else if (parts.length === 1 && !RESERVED[first] && ALIAS.test(dec(parts[0]))) to = profile(dec(parts[0]));
      if (to) {
        window.__bzRedirect = to;
        location.replace(to + (to.indexOf("#") < 0 ? hash : ""));
      }
    })();
  </script>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap prose">
    <div class="top">
      <a class="brand" href="/"><img src="/favicon-192.png" width="40" height="40" alt=""><span>BITCOINIZATE</span></a>
      <div class="lang-sw" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
    </div>
    <div id="nf">
      <h1 data-i18n="notFoundH">Page not found</h1>
      <p data-i18n="notFoundB">This page is not on the shelf. It may have moved.</p>
      <p><a href="/" data-i18n="backHome">Back to Bitcoinizate</a> · <a href="/choppy-bitcoin/">Choppy Bitcoin</a></p>
    </div>
  </div>
  <script src="/hub.js"></script>
  <script>
    if (window.__bzRedirect) {
      var nf = document.getElementById("nf");
      if (nf) nf.innerHTML = "<p><a href=\"" + window.__bzRedirect + "\">" + (window.BZHub ? BZHub.t("redirecting") : "Redirecting…") + "</a></p>";
    }
  </script>
</body>
</html>
